<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Words I Couldn't Say</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101010;
  color: #eeeeee;
  font-family: Georgia, serif;
}

header {
  text-align: center;
  padding: 65px 20px 40px;
}

h1 {
  font-size: 38px;
  font-weight: normal;
  letter-spacing: 2px;
}

header p {
  color: #888;
  font-style: italic;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.poem {
  background: #191919;
  padding: 30px;
  margin-bottom: 25px;
  border-radius: 8px;
  border: 1px solid #292929;
}

.poem h2 {
  font-weight: normal;
  color: #ddd;
}

.poem p {
  color: #aaa;
  line-height: 1.9;
  white-space: pre-line;
}

footer {
  text-align: center;
  padding: 40px;
  color: #555;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <h1>Words I Couldn't Say</h1>
  <p>Some feelings are easier to write than to say</p>
</header>

<main>

  <article class="poem">
    <h2>If Only I Knew</h2>
    <p>
Paste your verse here

    </p>
  </article>

  <!-- Copy this poem section whenever you want to add another verse -->

</main>

<footer>
  Written from the heart
</footer>

</body>
</html>
